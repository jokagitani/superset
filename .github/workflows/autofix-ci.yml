# Lightweight verification CI for AutoFix PRs.
#
# Drop this into your FORK at:  .github/workflows/autofix-ci.yml
#
# Why this exists: Superset's full CI is large and slow (and may not run on fork
# PRs). The verification gate needs a fast, authoritative green/red signal, so we
# run ONLY the checks relevant to the auto-generated fixes: ESLint + the targeted
# Jest tests for the changed util files. The orchestrator polls these check-runs.
name: AutoFix Verification

on:
  pull_request:
    branches: ["**"]
    paths:
      - "superset-frontend/src/utils/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superset-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: superset-frontend/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Prettier (formatting of changed area)
        run: npx prettier --check "src/utils/**/*.{ts,tsx}"

      - name: ESLint
        run: npx oxlint --config oxlint.json src/utils

      - name: Jest (unit tests)
        run: npm run test -- src/utils

      # Build the composite project references (packages/** and plugins/**) so
      # their lib/ declaration outputs exist. Without this, the project-wide
      # type-check below fails with TS6305 ("output file has not been built
      # from source file") for every PR, regardless of the change.
      #
      # continue-on-error: `tsc -b` performs declaration emit, which can report
      # pre-existing declaration-portability errors (TS4023/TS2742/TS4082) that
      # the authoritative gate (`tsc --noEmit`) does not. We only need this step
      # to produce the reference outputs; the real type gate is the next step.
      # Any reference that genuinely fails to build is still caught below as a
      # TS6305 error from `npm run type`.
      - name: Build TS project references
        run: npx tsc -b
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # The integration gate: a project-wide type-check catches a fix that
      # compiles in isolation but breaks type inference in *other* files.
      - name: Type-check (full project)
        run: npm run type
